name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Create Android Platform
        run: flutter create . --platforms=android --project-name=mule
      - name: Fix Kotlin Version
        run: |
          find android -name "settings.gradle" -exec sed -i 's/version "1.7.1"/version "1.9.0"/g' {} +
          find android -name "settings.gradle" -exec sed -i 's/version "1.8.22"/version "1.9.0"/g' {} +
          find android -name "build.gradle" -exec sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.0"/g' {} +
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
